on:
  push:
    branches:
      - main
      - attestation

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Go App
    steps:
      - name: Run Graph
        uses: actionforge/action@866e7df1ce5e84a2b32fda7414812ae72000dae8 # v0.14.6
        with:
          graph-file: build.act
